[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous ReAct research agent with web search, file reading, hybrid memory, and live execution logging"
requires-python = ">=3.10"
dependencies = [
    "langchain-groq",
    "python-dotenv",
    "pydantic>=2",
    "pymupdf",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "anyio",
    "colorama",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
research-agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent", "agent.tools", "server"]
